name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        run: |
          mkdir -p site
          cp templates/support.html site/index.html
          cp static/support.css site/support.css
          cp static/support.js site/support.js
          sed -i 's#/static/support.css#support.css#g; s#/static/support.js#support.js#g; s#href="/support"#href="./"#g; s#href="/"#href="./"#g' site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
